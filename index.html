<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070b"><title>Digital Ghost Town</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="boot"><div class="boot-inner"><div class="boot-mark">DGT</div><div class="boot-title">DIGITAL GHOST TOWN</div><div class="boot-sub">SRI LANKA / 03:17 AM</div><div class="boot-line"><span>SIGNAL DETECTED</span><i></i></div><button id="startBtn" type="button">ENTER TOWN</button><div class="boot-hint">HEADPHONES RECOMMENDED</div></div></div>
<main id="game" hidden>
<canvas id="world"></canvas>
<div class="vignette"></div><div class="scanlines"></div>
<header class="hud"><div class="brand">DGT <span>CHAPTER 01</span></div><div class="signal"><i></i><span id="signalText">SIGNAL LOST</span></div></header>
<div class="objective" id="objective">EXPLORE THE TOWN</div>
<div class="interact" id="interact">WALK CLOSER</div>
<div class="inventory"><span>POCKET</span><div id="items"></div></div>
<div class="touchpad" id="touchpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<aside id="panel" aria-hidden="true"><button id="closePanel">CLOSE</button><div id="panelContent"></div></aside>
<div id="toast"></div>
</main><script src="game.js"></script></body></html>
